name: Setup
description: Set up Node.js (version from package.json engines) with npm cache and install dependencies

runs:
  using: composite
  steps:
    - name: Use Node.js from package.json engines
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
