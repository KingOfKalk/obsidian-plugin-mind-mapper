version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it: most compromised package versions are
    # found and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      # esbuild and typescript produce the shipped main.js: their own group, which
      # dependabot-auto-merge.yml leaves for a manual merge.
      build-toolchain:
        dependency-type: development
        patterns:
          - esbuild
          - typescript
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        exclude-patterns:
          - esbuild
          - typescript
        update-types:
          - minor
          - patch

  # Actions are pinned by commit SHA with a `# vX.Y.Z` comment; Dependabot updates both.
  # `/` covers .github/workflows, the glob the composite actions in .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
