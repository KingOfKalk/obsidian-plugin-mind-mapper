name: Release

on:
  push:
    branches: [main]

# Default for every job; jobs that write ask for it explicitly.
permissions:
  contents: read

# One run at a time: two quick merges otherwise race on the release PR branch, and the
# versions-json push of the older run is rejected (#11). Queued runs are not cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Jobs: release-please -> (release created) build -> publish; (release PR changed) versions-json.
# `npm ci` and the build run in `build`, which holds a read-only token. Only release-please,
# versions-json and publish can write, and none of them install dependencies.
#
# Optional secret RELEASE_PLEASE_TOKEN (fine-grained PAT or GitHub App token with contents and
# pull-requests write): the release PR and the versions.json commit then trigger CI, so required
# status checks can pass on the release PR. Without it GITHUB_TOKEN is used, which does not
# trigger workflows.
jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Builds the release assets with a read-only token and hands them to `publish` as an artifact.
  # persist-credentials: false keeps the token out of .git/config, out of reach of install scripts.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Build plugin zip
        env:
          PLUGIN_ID: mind-mapper
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p "dist/${PLUGIN_ID}"
          cp main.js manifest.json styles.css "dist/${PLUGIN_ID}/"
          (cd dist && zip -r "../${PLUGIN_ID}-${VERSION}.zip" "${PLUGIN_ID}")

      - name: Upload release assets artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
            versions.json
            mind-mapper-${{ needs.release-please.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  # The only job that writes release assets: no checkout, no npm. --clobber lets a re-run replace
  # assets a failed attempt already uploaded.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release assets artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Upload plugin release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        working-directory: release-assets
        run: |
          gh release upload "$TAG" --repo "$REPO" --clobber \
            main.js \
            manifest.json \
            styles.css \
            versions.json \
            "mind-mapper-${VERSION}.zip"

  # Adds the release PR's version to versions.json on the release branch, so the entry is part of
  # the release commit and the release uploads the committed file. release-please rewrites the
  # branch whenever the PR changes and reports it in `prs_created`, so this runs after every PR
  # update and is a no-op when the entry is already there. Written with 2-space indent: Prettier
  # checks versions.json (`npm run format:check`). Pushes to the release branch, so it needs
  # contents: write; it installs nothing.
  versions-json:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Add version to versions.json
        run: |
          node -e '
            const fs = require("fs");
            const { version, minAppVersion } = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            versions[version] = minAppVersion;
            fs.writeFileSync("versions.json", JSON.stringify(versions, null, 2) + "\n");
          '
          if git diff --quiet -- versions.json; then
            echo "versions.json is up to date"
            exit 0
          fi
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "Adding ${VERSION} to versions.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add ${VERSION} to versions.json" -- versions.json
          git push
