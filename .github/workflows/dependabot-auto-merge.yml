name: Dependabot auto-merge

on: pull_request

# GITHUB_TOKEN reads the metadata and approves; the merge uses the App token (see below).
permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # esbuild and typescript produce the shipped main.js: their updates need a manual merge.
      # Exact name match (not a substring), so typescript-eslint still auto-merges.
      - name: Check for build toolchain updates
        id: toolchain
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          names=$(jq -r '[.[].dependencyName | select(. == "esbuild" or . == "typescript")] | join(", ")' <<<"$DEPENDENCIES")
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          if [ -n "$names" ]; then
            echo "::notice::Build toolchain update (${names}): not auto-merged, needs a manual review and merge."
          fi

      - name: Approve dev-dep or github-actions minor/patch updates
        if: |
          steps.toolchain.outputs.names == '' &&
          (steps.metadata.outputs.dependency-type == 'direct:development' ||
           steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # App token instead of GITHUB_TOKEN, so the merge to main starts release.yml and CI.
      # Dependabot runs see only Dependabot secrets (same names as the Actions secrets).
      # workflows: write because GitHub Actions updates change files in .github/workflows.
      - name: Create release App token
        id: app-token
        if: |
          steps.toolchain.outputs.names == '' &&
          (steps.metadata.outputs.dependency-type == 'direct:development' ||
           steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge for dev-dep or github-actions minor/patch updates
        if: steps.app-token.outcome == 'success'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
